<!doctype html>
<html lang="az" data-theme="classic" data-anim="on">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#080e1c">
<title>AZCHESS</title>
<meta name="description" content="AZCHESS — mobil üçün optimallaşdırılmış şahmat platforması.">
<meta property="og:title" content="AZCHESS">
<meta property="og:type" content="website">
<meta name="twitter:card" content="summary">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%230d1630'/%3E%3Cpath d='M0 0h16v16H0zM16 16h16v16H16z' fill='%2338bdf8'/%3E%3C/svg%3E">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
<symbol id="i-undo" viewBox="0 0 24 24"><path d="M9 14 4 9l5-5M4 9h9a6 6 0 0 1 0 12h-3"/></symbol>
<symbol id="i-flip" viewBox="0 0 24 24"><path d="M8 4v16m0 0-3-3m3 3 3-3M16 20V4m0 0-3 3m3-3 3 3"/></symbol>
<symbol id="i-flag" viewBox="0 0 24 24"><path d="M5 21V4h12l-2.5 4L17 12H5"/></symbol>
<symbol id="i-new" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
<symbol id="i-set" viewBox="0 0 24 24"><path d="M4 7h9M17 7h3M4 17h3M11 17h9M15 5v4M9 15v4"/></symbol>
</svg>
<header class="top"><h1 class="brand" aria-label="AZCHESS">
  <svg class="brand-mark" viewBox="0 0 32 32" aria-hidden="true"><defs><linearGradient id="lg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#7dd3fc"/><stop offset="1" stop-color="#2563eb"/></linearGradient></defs><path d="M8 26c6-1 9-4 10-9-1-6 1-10 6-12 3 5 2 10-2 13-2 2-4 3-6 4 4 0 7-1 9-3-1 5-6 8-12 8H8z" fill="url(#lg)"/><path d="M11 25c4-1 6-4 7-7" fill="none" stroke="#e0f2fe" stroke-width="1.5" stroke-linecap="round"/></svg>
  <span>AZ<b>CHESS</b></span></h1></header>
<main class="game">
  <section class="bcol">
    <div id="pl-top"></div>
    <div class="bwrap"><div id="board" class="board" role="group" data-i18n-aria="board"></div></div>
    <div id="pl-bot"></div>
  </section>
  <aside class="side">
    <div class="tools">
      <button class="tb" id="b-undo" type="button"><svg class="ic"><use href="#i-undo"/></svg><span data-i18n="undo"></span></button>
      <button class="tb" id="b-flip" type="button"><svg class="ic"><use href="#i-flip"/></svg><span data-i18n="flip"></span></button>
      <button class="tb" id="b-resign" type="button"><svg class="ic"><use href="#i-flag"/></svg><span data-i18n="resign"></span></button>
      <button class="tb" id="b-new" type="button"><svg class="ic"><use href="#i-new"/></svg><span data-i18n="newGame"></span></button>
      <button class="tb" id="b-set" type="button"><svg class="ic"><use href="#i-set"/></svg><span data-i18n="settings"></span></button>
      <button class="tb ai-btn" id="b-ai" type="button"><span>♟</span><span data-i18n="ai"></span></button>
      <button class="tb online-btn" id="b-online" type="button"><span class="on-dot">●</span><span data-i18n="online"></span></button>
    </div>
    <details id="hist" class="hist"><summary data-i18n="moves"></summary><ol id="moves"></ol></details>
  </aside>
</main>


<dialog id="dlg-online" aria-labelledby="on-title"><form method="dialog" class="dl online-dl">
  <button class="dialog-x" id="on-close" type="button" aria-label="Bağla">×</button>
  <div id="on-menu">
    <h2 id="on-title" data-i18n="online"></h2><p class="sub" data-i18n="onlineDesc"></p>
    <div class="acts"><button class="btn pri" id="on-create" type="button" data-i18n="createRoom"></button></div>
    <label class="row"><span data-i18n="roomCode"></span><input id="on-input" inputmode="numeric" maxlength="6" placeholder="123456"></label>
    <button class="btn" id="on-join" type="button" data-i18n="joinRoom"></button>
  </div>
  <div id="on-live" hidden>
    <h2 data-i18n="onlineGame"></h2>
    <p id="on-status" class="sub"></p>
    <div id="on-room" class="room" hidden><span data-i18n="roomCode"></span><b id="on-code"></b><button class="btn" id="on-copy" type="button" data-i18n="copy"></button></div>
    <div class="acts online-acts">
      <button class="btn" id="on-draw" type="button" data-i18n="offerDraw"></button>
      <button class="btn" id="on-leave" type="button" data-i18n="leaveGame"></button>
      <button class="btn" id="on-rejoin" type="button" data-i18n="rejoin" hidden></button>
    </div>
    <div class="chat"><div class="chat-head" data-i18n="chat"></div><div id="chat-list" class="chat-list"></div><div class="chat-send"><input id="chat-input" maxlength="300" autocomplete="off" data-i18n-placeholder="messagePlaceholder"><button class="btn pri" id="chat-send" type="button" data-i18n="send"></button></div></div>
  </div>
</form></dialog>
<dialog id="dlg-ai" aria-labelledby="ai-title"><form method="dialog" class="dl ai-dialog">
  <button class="dialog-x" id="ai-close" type="button" aria-label="Bağla">×</button>
  <h2 id="ai-title" data-i18n="ai"></h2>
  <p class="sub" data-i18n="aiDesc"></p>
  <div class="ai-levels">
    <button class="btn" type="button" data-ai="1" data-i18n="easy"></button>
    <button class="btn pri" type="button" data-ai="2" data-i18n="medium"></button>
    <button class="btn" type="button" data-ai="3" data-i18n="hard"></button>
  </div>
</form></dialog>
<dialog id="dlg-draw" aria-labelledby="draw-title"><form method="dialog" class="dl"><h2 id="draw-title" data-i18n="drawOffer"></h2><p class="sub" data-i18n="drawQuestion"></p><div class="acts"><button class="btn pri" id="d-yes" type="button" data-i18n="accept"></button><button class="btn" id="d-no" type="button" data-i18n="decline"></button></div></form></dialog>
<div id="toast" class="toast" hidden></div>

<dialog id="dlg-result" aria-labelledby="r-title"><form method="dialog" class="dl">
  <h2 id="r-title"></h2><p id="r-sub" class="sub"></p>
  <div class="acts">
    <button class="btn pri" id="r-again" data-i18n="rematch"></button>
    <button class="btn" id="r-new" data-i18n="newGame"></button>
    <button class="btn" data-i18n="close"></button>
  </div>
</form></dialog>

<dialog id="dlg-settings" aria-labelledby="ds-t"><form method="dialog" class="dl">
  <h2 id="ds-t" data-i18n="settings"></h2>
  <fieldset><legend data-i18n="game"></legend>
    <label class="row"><span data-i18n="time"></span><select id="s-preset"></select></label>
    <label class="row"><span data-i18n="min"></span><input id="s-min" type="number" inputmode="numeric" min="1" max="180"></label>
    <label class="row"><span data-i18n="inc"></span><input id="s-inc" type="number" inputmode="numeric" min="0" max="60"></label>
    <label class="row"><span data-i18n="legal"></span><input id="s-legal" type="checkbox"></label>
    <label class="row"><span data-i18n="coords"></span><input id="s-coords" type="checkbox"></label>
  </fieldset>
  <fieldset><legend data-i18n="appearance"></legend>
    <div class="lb" data-i18n="theme"></div><div class="sws" id="sw-theme"></div>
    <div class="lb" data-i18n="pieces"></div><div class="sws" id="sw-pieces"></div>
    <label class="row"><span data-i18n="anim"></span><input id="s-anim" type="checkbox"></label>
  </fieldset>
  <button class="btn pri" data-i18n="close"></button>
</form></dialog>

<script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js"></script>
<script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
<script type="module" src="js/main.js"></script>
</body>
</html>
