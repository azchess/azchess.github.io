<!DOCTYPE html>
<html lang="az">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>AzChess — Onlayn Şahmat</title>

  <!-- Google Fonts & Chessboard CSS -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/chessboard-js/1.0.0/chessboard-1.0.0.min.css">
  <link rel="stylesheet" href="styles.css">

  <!-- Dependencies -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.6.4/jquery.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/chessboard-js/1.0.0/chessboard-1.0.0.min.js"></script>
  <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
</head>
<body>
  <div id="app">
    <!-- Header -->
    <header class="app-header">
      <div class="logo-area" id="btn-brand">
        <div class="logo-icon">♟</div>
        <span class="logo-text">AzChess</span>
      </div>

      <div class="header-right">
        <div class="lang-selector-mini">
          <select id="select-lang-head" aria-label="Language">
            <option value="az">AZ</option>
            <option value="ru">RU</option>
            <option value="en">EN</option>
          </select>
        </div>
        <button id="btn-settings-head" class="icon-btn" title="Settings">⚙</button>
      </div>
    </header>

    <!-- Main Views Container -->
    <main class="main-content">
      
      <!-- HOME SCREEN -->
      <section id="view-home" class="view active">
        <div class="hero-card">
          <div class="badge">AzChess v2.0</div>
          <h1 data-i18n="hero_title">Müasir Onlayn Şahmat</h1>
          <p data-i18n="hero_desc">Dostlarınla onlayn, üz-üzə və ya süni intellektə qarşı pulsuz şahmat oyna.</p>
          
          <div class="menu-grid">
            <button id="btn-mode-online" class="menu-btn primary">
              <span class="btn-icon">🌐</span>
              <div class="btn-text">
                <strong data-i18n="play_online">Onlayn Oyna</strong>
                <small data-i18n="play_online_sub">P2P Otaq / Linklə dəvət</small>
              </div>
            </button>

            <button id="btn-mode-ai" class="menu-btn">
              <span class="btn-icon">🤖</span>
              <div class="btn-text">
                <strong data-i18n="play_ai">Kompüterə Qarşı</strong>
                <small data-i18n="play_ai_sub">Stockfish Mühərriki</small>
              </div>
            </button>

            <button id="btn-mode-local" class="menu-btn">
              <span class="btn-icon">👥</span>
              <div class="btn-text">
                <strong data-i18n="play_local">Pass & Play</strong>
                <small data-i18n="play_local_sub">Eyni cihazda 2 nəfər</small>
              </div>
            </button>
          </div>
        </div>
      </section>

      <!-- GAME SCREEN -->
      <section id="view-game" class="view">
        <div class="game-container">
          
          <!-- Top Player Bar -->
          <div class="player-bar" id="player-top">
            <div class="player-info">
              <span class="player-avatar" id="avatar-top">👤</span>
              <span class="player-name" id="name-top">Rəqib</span>
            </div>
            <div class="clock" id="clock-top">10:00</div>
          </div>

          <!-- Board Wrapper -->
          <div class="board-wrapper">
            <div id="board"></div>
          </div>

          <!-- Bottom Player Bar -->
          <div class="player-bar" id="player-bottom">
            <div class="player-info">
              <span class="player-avatar" id="avatar-bottom">👤</span>
              <span class="player-name" id="name-bottom">Sən</span>
            </div>
            <div class="clock" id="clock-bottom">10:00</div>
          </div>

          <!-- Game Controls & Move Log -->
          <div class="game-panel">
            <div class="move-history" id="move-list"></div>
            
            <div class="game-actions">
              <button id="btn-draw" class="action-btn" title="Draw">½</button>
              <button id="btn-resign" class="action-btn danger" title="Resign">🏳</button>
              <button id="btn-flip" class="action-btn" title="Flip Board">🔄</button>
              <button id="btn-home" class="action-btn" title="Home">🏠</button>
            </div>
          </div>

        </div>
      </section>
    </main>

    <!-- MODAL: ONLINE MENU -->
    <div id="modal-online" class="modal-backdrop">
      <div class="modal-box">
        <button class="modal-close" id="btn-close-online">✕</button>
        <h3 data-i18n="online_menu">Onlayn Oyun</h3>
        
        <div class="tc-select-group">
          <label data-i18n="time_control">Vaxt Nəzarəti:</label>
          <select id="select-tc-online">
            <option value="60">1 dəq (Bullet)</option>
            <option value="180">3 dəq (Blitz)</option>
            <option value="300" selected>5 dəq (Blitz)</option>
            <option value="600">10 dəq (Rapid)</option>
            <option value="0">Vaxtsız</option>
          </select>
        </div>

        <button id="btn-create-room" class="btn-block primary" data-i18n="create_room">Otaq Yarat</button>

        <div class="divider"><span>və ya</span></div>

        <div class="join-group">
          <input type="text" id="input-room-code" placeholder="6-rəqəmli kod" maxlength="6">
          <button id="btn-join-room" class="btn-block" data-i18n="join_room">Qoşul</button>
        </div>

        <div id="room-info" class="room-info-box hidden">
          <p data-i18n="waiting_opponent">Rəqib gözlənilir...</p>
          <div class="room-code-display" id="display-room-code">------</div>
          <button id="btn-copy-link" class="btn-sm" data-i18n="copy_link">📋 Linki Kopyala</button>
        </div>
      </div>
    </div>

    <!-- MODAL: SETTINGS -->
    <div id="modal-settings" class="modal-backdrop">
      <div class="modal-box">
        <button class="modal-close" id="btn-close-settings">✕</button>
        <h3 data-i18n="settings">Tənzimləmələr</h3>
        
        <div class="setting-item">
          <label data-i18n="language">Dil / Language:</label>
          <select id="select-lang-modal">
            <option value="az">Azərbaycan</option>
            <option value="ru">Русский</option>
            <option value="en">English</option>
          </select>
        </div>

        <div class="setting-item">
          <label data-i18n="board_theme">Lövhə Mövzusu:</label>
          <select id="select-board-theme">
            <option value="classic">Klassik (Qəhvəyi)</option>
            <option value="blue">Mavi (Lichess Blue)</option>
            <option value="green">Yaşıl (Lichess Green)</option>
            <option value="purple">Bənövşəyi</option>
            <option value="dark">Tünd Kömür</option>
          </select>
        </div>

        <div class="setting-item">
          <label data-i18n="sound_effects">Səs Effektləri:</label>
          <input type="checkbox" id="check-sound" checked>
        </div>
      </div>
    </div>

    <!-- Toast Notifications Container -->
    <div id="toast-container"></div>
  </div>

  <script src="styles.js"></script>
  <script src="network.js"></script>
  <script src="ai.js"></script>
  <script src="game.js"></script>
</body>
</html>
